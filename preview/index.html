<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F8FD">
  <meta name="color-scheme" content="light">
  <title>平江安澜 · 水利工程概论</title>
  <link rel="stylesheet" href="app.css">
  <script src="study-data.js" defer></script>
  <script src="generated-answers.js" defer></script>
  <script src="question-images.js" defer></script>
  <script src="question-types.js" defer></script>
  <script src="native-adapter.js" defer></script>
  <script src="memory-scheduler.js" defer></script>
  <script src="ai-settings.js" defer></script>
  <script src="question-type-support.js" defer></script>
  <script src="cloud-account.js" defer></script>
  <script src="cloud-sync.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div class="review-badge" aria-label="当前为界面审查版网页预览">
    <span>界面审查版</span>
    <small>网页预览 · 非安装包</small>
  </div>

  <div class="app-shell" id="app-shell">
    <div class="app-scroll" id="app-scroll">
      <header class="topbar">
        <div class="brand" aria-label="平江安澜，水利工程概论">
          <span class="brand-seal" aria-hidden="true">澜</span>
          <div class="brand-copy">
            <span class="brand-eyebrow">水利工程概论</span>
            <h1 class="brand-title">平江安澜</h1>
          </div>
        </div>
        <span class="topbar-note" aria-hidden="true">治水有方</span>
      </header>

      <div class="storage-warning" id="storage-warning" role="alert" hidden>
        本机存储不可用，本次改动只保留在当前页面。
      </div>

      <main id="main-content" tabindex="-1"></main>
    </div>

    <div id="rating-dock" class="rating-dock" role="group" aria-label="回忆自评"></div>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab-button" type="button" data-tab="review" aria-label="复习">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 5.5c3.2-.8 5.9-.2 8 1.8v12c-2.1-2-4.8-2.6-8-1.8z"></path>
          <path d="M20 5.5c-3.2-.8-5.9-.2-8 1.8v12c2.1-2 4.8-2.6 8-1.8z"></path>
        </svg>
        <span>复习</span>
      </button>
      <button class="tab-button" type="button" data-tab="select" aria-label="选题">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 4.5h14v15H5z"></path>
          <path d="M8 8h8M8 11.5h8M8 15h4.5"></path>
        </svg>
        <span>选题</span>
      </button>
      <button class="tab-button" type="button" data-tab="stats" aria-label="统计">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 19.5h16"></path>
          <path d="M6.5 16.5v-4M11 16.5V7M15.5 16.5v-6M20 16.5V9"></path>
        </svg>
        <span>统计</span>
      </button>
      <button class="tab-button" type="button" data-tab="me" aria-label="我的">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.3"></circle>
          <path d="M5.2 19.5c.7-3.4 3.3-5.4 6.8-5.4s6.1 2 6.8 5.4"></path>
        </svg>
        <span>我的</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <noscript>
    <p class="noscript">请启用浏览器 JavaScript 以使用平江安澜离线预览。</p>
  </noscript>
</body>
</html>
